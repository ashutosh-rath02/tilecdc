# Build manylinux wheels and publish to PyPI when a GitHub release is published.
# Manual runs build and test only. Bump the version in python/pyproject.toml and
# include/tilecdc.h before each release: PyPI never accepts the same version twice.
# Setup once: create the "tilecdc" project on PyPI with a Trusted Publisher
# pointing at this repository and workflow (no API token needed).
name: wheels
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  wheels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
        with: { package-dir: python }
        env:
          CIBW_ARCHS: x86_64
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28   # GCC 12+: AMX intrinsics
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest -q {project}/python/tests"
      - uses: actions/upload-artifact@v4
        with: { name: wheels, path: wheelhouse/*.whl }
  # GitHub runners have no AMX. Run the built wheel's tests under Intel SDE
  # emulating Sapphire Rapids so the AMX path is exercised before publishing.
  amx-emulated:
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: wheels, path: wheelhouse }
      - uses: petarpetrovt/setup-sde@v2.4
        with: { environmentVariableName: SDE_PATH }
      - run: |
          pip install pytest wheelhouse/*cp312*.whl
          cd /tmp
          $SDE_PATH/sde64 -spr -- python -c "import tilecdc; print(tilecdc.available_impls()); assert 'amx' in tilecdc.available_impls(); c = tilecdc.Chunker(impl='amx'); d = bytes(range(256)) * 20000; assert c.chunk(d) == tilecdc.Chunker(impl='scalar').chunk(d); print('amx ok')"
          $SDE_PATH/sde64 -spr -- python -m pytest -q $GITHUB_WORKSPACE/python/tests
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install build && cd python && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: python/dist/*.tar.gz }
  publish:
    needs: [wheels, sdist, amx-emulated]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
